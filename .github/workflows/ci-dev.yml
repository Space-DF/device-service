name: CI

on:
  push:
    branches: [ "dev" ]
  pull_request:
    branches: [ "dev" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"
    - name: Set up uv
      uses: astral-sh/setup-uv@v5
      with:
        version: "0.6.5"
    - name: Install Dependencies
      run: |
        uv pip install --system flake8==4.0.1 bandit==1.7.8 codespell==2.2.4
    - name: Run Flake8
      run: |
        flake8
    - name: Run Bandit
      run: |
        bandit -r .
    - name: Run Spell Check
      run: |
        codespell --skip="*.md,venv,migrations,*.pyc"
